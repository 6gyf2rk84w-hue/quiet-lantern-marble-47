<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B1A26">
<title>Panel Tracker</title>
<link rel="stylesheet" href="order-tracker.css">
<style>
:root{--bg:#0B1A26;--card:#1C2C38;--card2:#2C3C48;--line:rgba(255,255,255,.11);--ink:#fff;--mute:rgba(255,255,255,.62);--a1:#12C26A;--a2:#2BF08F;--ok:#34d399;--bad:#fb7185;--wait:#fbbf24;--part:#f97316;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.4 "Geist",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(11,26,38,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;min-height:46px;max-width:640px;margin:0 auto}
#back{display:none;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#ttl{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
#crumb{font-size:14px;color:var(--mute);margin-top:2px}
#tabs{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:10px auto 0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs{max-width:none;margin:2px -14px -10px;padding:8px 18px 20px;-webkit-overflow-scrolling:touch;scroll-padding:0 18px}
#tabs::after{content:"";flex:0 0 4px}
#tabs button.on{box-shadow:0 4px 12px rgba(27,224,127,.4)}
#tabs button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:15px;font-weight:500}
#tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#06210F;font-weight:600;box-shadow:0 4px 16px rgba(27,224,127,.4)}
#main{max-width:640px;margin:0 auto;padding:14px 14px 130px}
.sec{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.sec:active{background:var(--card2)}
.ico{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#06210F;box-shadow:0 4px 14px rgba(27,224,127,.35)}
.sec .i{flex:1;min-width:0}.sec .t{font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis}.sec .s{color:var(--mute);font-size:14px}
.chev{color:var(--mute);font-size:22px}
.ghost{border:none;background:none;color:var(--mute);font-size:19px;padding:6px}
.sg{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:22px 2px 10px}
.dot{width:9px;height:9px;border-radius:50%}
.ord{padding:14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.ord .top{display:flex;justify-content:space-between;gap:8px}
.ord .t{font-weight:600;font-size:18px}
.price{color:var(--a2);font-size:15px;margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{padding:9px 0;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mute);font-size:14px}
.seg .processing.on{background:rgba(251,191,36,.16);color:var(--wait);border-color:var(--wait)}
.seg .working.on{background:rgba(52,211,153,.16);color:var(--ok);border-color:var(--ok)}
.seg .failed.on{background:rgba(251,113,133,.16);color:var(--bad);border-color:var(--bad)}
.mh{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:28px 2px 8px;background:linear-gradient(135deg,#fff,#bdf7d6 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:600;color:var(--ink)}
.cnt{color:var(--a2);font-size:14px;font-weight:600;background:rgba(79,160,255,.12);border-radius:999px;padding:2px 10px}
.empty{text-align:center;color:var(--mute);margin-top:90px;line-height:1.6}
.empty b{display:block;font-size:42px;margin-bottom:8px}
#fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--a1),var(--a2));color:#06210F;font-size:34px;line-height:1;box-shadow:0 8px 28px rgba(27,224,127,.55);z-index:8}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:40}
#sheet{background:#13222E;border:1px solid var(--line);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet h3{margin:0 0 14px;font-size:22px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:17px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--a1)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#06210F;font-size:17px;font-weight:600;margin-top:6px}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.mh{display:flex;align-items:center;gap:10px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.mt{background:linear-gradient(135deg,#fff,#bdf7d6 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.me{font-size:30px}
.ico{font-size:24px}
.ico{width:52px;height:52px;background:none;box-shadow:none;border-radius:0;font-size:44px;line-height:1}
.ico.l{font-size:28px;font-weight:700;color:var(--mute)}
.sec{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ico img{width:100%;height:100%;object-fit:contain;display:block}
.me{width:36px;height:36px;object-fit:contain}
.seg{grid-template-columns:repeat(4,1fr);gap:5px}
.seg button{font-size:12.5px}
.seg .partial.on{background:rgba(249,115,22,.18);color:var(--part);border-color:var(--part)}
#tabs button.t-working.on{background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 4px 12px rgba(52,211,153,.4)}
#tabs button.t-partial.on{background:linear-gradient(135deg,#ea580c,#fb923c);box-shadow:0 4px 12px rgba(249,115,22,.45)}
#tabs button.t-failed.on{background:linear-gradient(135deg,#dc2626,#fb7185);box-shadow:0 4px 12px rgba(251,113,133,.4)}
#pen{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#pen.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 4px 16px rgba(27,224,127,.5)}
.dangerbtn{background:linear-gradient(135deg,#dc2626,#fb7185)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.lbox{width:100%;max-width:380px}
.lt{font-size:34px;font-weight:800;margin:0 0 6px;background:linear-gradient(135deg,#fff,#bdf7d6 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lp{color:var(--mute);margin:0 0 18px}
#lmsg{color:var(--bad);margin-top:12px;font-size:15px;min-height:20px}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#2a1620;border:1px solid var(--bad);color:var(--ink);padding:12px 14px;border-radius:14px;z-index:70;font-size:15px}
.hrow{position:relative}
#more{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#menu{display:none;position:absolute;top:52px;right:0;min-width:170px;background:#16293A;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20}
#menu.on{display:block}
#menu button{width:100%;text-align:left;border:none;background:none;color:var(--bad);font-size:16px;font-weight:600;padding:12px;border-radius:10px}
#menu button:active{background:var(--card2)}
#menu .mi{color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--bad);background:rgba(251,113,133,.12);color:var(--bad);font-size:18px;line-height:1}
.fl{display:block;text-align:center;color:var(--a2);margin-top:14px;font-size:15px;background:none;border:none;width:100%}
.ok{color:var(--ok)!important}
#cpage{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#cpage.on{display:block}
.chead{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(11,26,38,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:2}
.chead .cb{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px;display:flex;align-items:center;justify-content:center}
.chead h2{margin:0;font-size:24px;font-weight:700;flex:1}
#clist{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.ccard{padding:14px;margin-bottom:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.ccard .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:19px;margin-bottom:8px}
.cf{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.cf .cl{flex:none;width:72px;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.cf .cv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.cf button{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px}
html,body{overflow-x:hidden;max-width:100%}
.tw{flex:1;min-width:0}
#ttl,#crumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pen{margin-left:0}
.xdel{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--bad);background:rgba(251,113,133,.12);color:var(--bad);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.ico.ed{outline:2px dashed var(--a1);outline-offset:3px;border-radius:10px;cursor:pointer}
.grip{flex:none;width:30px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:20px;letter-spacing:-3px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;margin:-6px 0 -6px -4px}
.ord .top .grip{align-self:center;height:44px}
.seg button:disabled{cursor:default}
.seg button:disabled:not(.on){opacity:.45}
.mrow .rtag{flex:none;overflow:visible;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(27,224,127,.16);color:#9FF0C4}
.mrow .rtag.v{background:rgba(79,160,255,.14);color:var(--a2)}
.excard{margin:6px 0 4px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.exhead{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.exinfo{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(251,191,36,.6);background:rgba(251,191,36,.18);color:var(--wait);font-size:16px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;animation:expulse 2.6s ease-in-out infinite}
.exinfo.on{background:var(--wait);color:#1a1205;animation:none}
@keyframes expulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 0 6px rgba(251,191,36,.16),0 0 14px rgba(251,191,36,.45)}}
@media (prefers-reduced-motion:reduce){.exinfo{animation:none}}
.exlink{margin-top:6px;color:var(--mute);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:all;user-select:all}
.exnote{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:#fde68a;font-size:14px;line-height:1.45}
.oid{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;font-size:12px;font-weight:600;letter-spacing:.02em;color:#9FF0C4;background:rgba(27,224,127,.14);border:1px solid rgba(27,224,127,.3);border-radius:8px;padding:2px 8px;margin-bottom:6px;font-variant-numeric:tabular-nums}
#tabs button.t-processing.on{background:linear-gradient(135deg,#b45309,#f59e0b);box-shadow:0 4px 12px rgba(251,191,36,.4)}
.idbtn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 10px;border-radius:9px;border:1px dashed rgba(27,224,127,.55);background:rgba(27,224,127,.1);color:#9FF0C4;font-size:13px;font-weight:600}
.oacts{display:flex;gap:8px;margin-top:10px}
.oact{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:14px;font-weight:600}
.oact.go{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#06210F}
.svc{display:inline-block;margin:0 0 6px 6px;font-size:12px;font-weight:600;color:var(--a2);background:rgba(79,160,255,.1);border:1px solid rgba(79,160,255,.28);border-radius:8px;padding:2px 8px;vertical-align:top}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;word-break:break-all}
.pinfo{color:var(--mute);font-size:14px;margin:-6px 0 12px;line-height:1.5}
.perr{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.btn:disabled{opacity:.55}
.dragging{position:relative;z-index:6;background:#22323E!important;box-shadow:0 14px 34px rgba(0,0,0,.55);border-color:var(--a1)!important}
/* two screens: Orders Tracker + Panels Tracker */
html,body{overscroll-behavior-x:none}
body{touch-action:pan-y}
body.ot-on{background:#0B1A26}
body.ot-on::before{background:#0B1A26}
.scr{will-change:auto}
#oscreen{min-height:100vh}
.ohead{max-width:640px;margin:0 auto;padding:16px 16px 0;text-align:center}
.ohead h1{margin:0;font:800 30px/1.1 "Bricolage Grotesque","Arial Black",system-ui,sans-serif;letter-spacing:-.02em;color:#fff}
.dots{display:flex;justify-content:center;gap:10px;padding:10px 0 2px}
.dots button{width:26px;height:22px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::after{content:"";width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);transition:background .2s,transform .2s}
.dots button.on::after{background:#fff;transform:scale(1.15)}
#top .dots{padding:6px 0 0}
#otnote{max-width:640px;margin:10px auto 0;padding:0 16px;display:none}
#otnote div{border-radius:14px;padding:10px 14px;background:rgba(255,196,0,.12);border:1px solid rgba(255,196,0,.45);color:#FFD76A;font:600 14px/1.4 "Geist",system-ui,sans-serif}
body.swiping,body.swiping *{-webkit-user-select:none!important;user-select:none!important}
body.swiping .scr *{pointer-events:none!important}
/* menu reachable from both screens */
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:max(14px,calc(50vw - 306px));z-index:40}
.ohead{position:relative}
.omore{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
/* members page */
#mpage{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#mpage.on{display:block}
#mbody{max-width:640px;margin:0 auto;padding:14px 14px 60px}
.madd{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:22px}
.mh2{font-weight:700;font-size:17px;margin-bottom:10px}
.rseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 6px}
.rseg button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mute);font-size:15px;font-weight:600}
.rseg button.on{background:rgba(27,224,127,.2);border-color:var(--a1);color:#fff}
.mmsg{color:var(--bad);font-size:14.5px;margin-top:8px;line-height:1.45}
.mmsg a,.perr a{color:var(--a2)}
.msec{margin-bottom:20px}
.msh{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 4px 8px}
.mrow2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:16px}
.mav{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.12)}
.s-owner .mav{background:rgba(251,191,36,.18)}
.s-mod .mav{background:linear-gradient(135deg,#0FA45E,#2BF08F)}
.s-user .mav{background:linear-gradient(135deg,#2563eb,#4FA0FF)}
.s-viewer .mav{background:rgba(255,255,255,.14);color:var(--mute)}
.mrow2 .mem{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow2 .chev{color:var(--mute);font-size:20px}
.mrow2 .rtag{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(251,191,36,.16);color:var(--wait)}
.mnone{color:var(--mute);font-size:14.5px;padding:2px 4px 4px}
.rpick{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.rpick b{display:block;font-size:16.5px}
.rpick small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.rpick.on{border-color:var(--a2);background:rgba(79,160,255,.1)}
/* approval */
.apv{display:block;width:100%;margin-top:10px;padding:10px 0;border-radius:12px;border:1px dashed rgba(52,211,153,.6);background:rgba(52,211,153,.07);color:var(--ok);font-size:14.5px;font-weight:600}
.apv.on{border-style:solid;background:rgba(52,211,153,.16)}
.apvtag{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--wait)}
.apvtag.on{color:var(--ok)}
/* step-by-step picker */

var vStore={
  load:async function(){

  },

    var up=[],now={},r;
    list.forEach(function(o){var c=vClean(o),j=JSON.stringify(c);now[o.id]=j;if(vSnap[o.id]!==j)up.push({id:o.id,data:c})});

/* ---------- Goal engine: ratios + CPM plan ----------
   Ratios (likes per view and so on) come from everyone's real numbers, combined: your past videos plus every
   video logged in the app. Supabase only ever hands back month totals, never anyone's videos.
   A month's ratios = the two months before it; nothing there → the learned average → the starting ratios. */
var GE={months:null,spreadFrom:'2026-09',learnFrom:'2026-10',start:{likes:.0583,shares:.0224,saves:.01,reposts:.007,comments:.000107}};

setInterval(function(){if(user&&!document.hidden)loadEngine()},30*60e3);
// month totals: from Supabase once its step is run; until then, just the videos this phone can see
function gMonths(){
  if(GE.months)return GE.months;
  var out={},raw={};
  ((otApi&&otApi.orders)||[]).forEach(function(o){var r=o.real||{},v=+r.views||0;if(!(v>0)||!o.month)return;
    var t=out[o.month]=out[o.month]||{n:0,views:0};t.n++;t.views+=v;(raw[o.month]=raw[o.month]||[]).push(v);
    GSTATS.forEach(function(s){if(r[s]!=null){t[s]=(t[s]||0)+(+r[s]||0);t[s+'_v']=(t[s+'_v']||0)+v}})});
  Object.keys(out).forEach(function(m){var a=raw[m],avg=out[m].views/a.length;out[m].spread=a.length>=2?a.map(function(x){return x/avg}):[]});

    GSTATS.forEach(function(s){if(t[s+'_v']>0){tot[s]=(t[s]||0)/t[s+'_v'];any=true}});
    if(!any)return;Object.keys(tot).forEach(function(s){r[s]=(r[s]*n+tot[s])/(n+1)});n++});

}

function gHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}

function gPool(m){var M=gMonths(),out=[];Object.keys(M).filter(function(k){return k>=GE.spreadFrom&&k<m}).forEach(function(k){(M[k].spread||[]).forEach(function(x){if(x>0)out.push(+x)})});

// CPM plan: total views needed = videos × pay per video ÷ CPM × 1,000, split into a views goal per video.
// A video with its own views goal keeps it (or its real views, if already past it). A video already past its
// share keeps its real views. Whatever's left is split by the spread, in whole thousands.
function gPlan(m,list,cpm,deal,isCurrent){
  var orders=+deal.count||0,per=+deal.per||0;if(!(cpm>0)||!(orders>0)||!(per>0))return null;

  var pay=orders*per,T=pay/cpm*1000,w=gShape(m,n),items=[],left=T,i;
  for(i=0;i<n;i++){var o=list[i]||null,real=o?(+((o.real||{}).views)||0):0,tv=o?(+((o.goals||{}).views)||0):0;
    if(o&&tv>0){items.push({id:o.id,posted:true,set:true,goal:tv,real:real});left-=Math.max(tv,real)}
    else items.push({id:o?o.id:null,posted:!!o,set:false,goal:0,real:real,w:w[i]})}

var ROLES=[['mod','Mods','Mod','Adds and tests services on the Panels screen.'],['user','Users','User','Logs their own videos and picks approved services.'],['viewer','Viewers','Viewer','Only looks at the Orders screen.']],addRole='user';
function roleName(r){var x=ROLES.filter(function(y){return y[0]===r})[0];return x?x[2]:'Viewer'}
async function loadMem(){if(!isAdmin)return null;var r=await sb.from('members').select('*').order('added_at',{ascending:true});if(!r.error)MEM=r.data||[];return r}
function setupHint(msg){
  if(/no account/i.test(msg))return 'No account with that email yet. Create it in <a href="https://supabase.com/dashboard/project/ttnvbmqtyxbqfyxadjdf/auth/users" target="_blank" rel="noopener">Supabase → Users</a> first, then add them here.';
  if(/check constraint|role|function/i.test(msg))return 'Run the roles setup in the <a href="https://supabase.com/dashboard/project/ttnvbmqtyxbqfyxadjdf/sql/new" target="_blank" rel="noopener">Supabase SQL Editor</a> first.';
  return esc(msg);
}
async function invite(email,role){
  try{
    var r=await sb.functions.invoke('invite',{body:{email:email,role:role}});
    if(r.error){var m=r.error.message||'Request failed';try{var j=await r.error.context.json();if(j&&j.error)m=j.error}catch(e){}
      if(/Failed to send|not found|404|FunctionsFetchError|FunctionsRelayError/i.test(m+' '+(r.error.name||'')))return {error:'One-time setup needed: add the <b>invite</b> function in <a href="https://supabase.com/dashboard/project/ttnvbmqtyxbqfyxadjdf/functions" target="_blank" rel="noopener">Supabase → Edge Functions</a>.'};
      return {error:esc(m)}}
    if(!r.data||!r.data.password)return {error:'No reply from Supabase. Try again.'};
    return r.data;
  }catch(e){return {error:esc(String((e&&e.message)||e))}}
}
var APP_URL='https://6gyf2rk84w-hue.github.io/quiet-lantern-marble-47/';
function inviteText(inv){
  var head='Here’s your app:\n'+APP_URL+'\n\nEmail: '+inv.email+'\n\nPassword: '+inv.password+'\n\n';
  if(IG.sql&&inv.role!=='viewer')return head+'1. Copy and paste this link into Safari, or press and hold it and tap Open in Safari:\nhttps://www.instagram.com/accounts/manage_access/\n\n2. Log into your real Instagram, tap Tester Invites, then tap Accept.\n\n3. Open the app link in Safari, tap Share, then Add to Home Screen.\n\n4. Open the app from your home screen, sign in, and tap Connect Instagram.';
  return head+'1. Open the app link in Safari, tap Share, then Add to Home Screen.\n\n2. Open the app from your home screen and sign in.';
}
function showInvite(inv){
  var txt=inviteText(inv);
  openSheet('<h3>'+esc(short(inv.email))+' is added</h3><div class="pinfo">Send them this. You won’t see this password again.</div><div class="invbox">'+esc(txt)+'</div><a class="btn" id="sms" href="sms:&body='+encodeURIComponent(txt)+'" style="display:block;text-align:center;text-decoration:none">Text it to them</a><button class="btn alt" id="ok">Copy message</button><button class="btn alt" id="x">Done</button>');
  document.getElementById('ok').onclick=function(){copyText(txt)};
  document.getElementById('x').onclick=closeSheet;
}
async function openMembers(){
  if(!isAdmin)return;
  document.getElementById('menu').classList.remove('on');
  document.getElementById('mpage').classList.add('on');
  document.getElementById('mbody').innerHTML='<div class="empty" style="margin-top:60px">Loading...</div>';
  var r=await loadMem();
  if(r&&r.error){document.getElementById('mbody').innerHTML='<div class="empty" style="margin-top:60px">Could not load members.<br>'+esc(r.error.message)+'</div>';return}
  drawMembers();
}
function drawMembers(){
  var h='<div class="madd"><div class="mh2">Add someone</div><input type="email" id="maddE" placeholder="Their email address" autocomplete="off" autocapitalize="off"><div class="rseg" id="rseg">'+ROLES.map(function(r){return '<button data-ar="'+r[0]+'" class="'+(addRole===r[0]?'on':'')+'">'+r[2]+'</button>'}).join('')+'</div><button class="btn" id="maddGo">Add as '+roleName(addRole)+'</button><div class="mmsg" id="mmsg"></div></div>';
  h+='<div class="msec s-owner"><div class="msh">Owner — 1</div><div class="mrow2"><span class="mav">\u{1F451}</span><span class="mem">'+esc(user.email||'You')+'</span><span class="rtag">You</span></div></div>';
  ROLES.forEach(function(r){
    var l=MEM.filter(function(m){return (ROLES.some(function(y){return y[0]===m.role})?m.role:'viewer')===r[0]});
    h+='<div class="msec s-'+r[0]+'"><div class="msh">'+r[1]+' — '+l.length+'</div>'+(l.length?l.map(function(m){return '<button class="mrow2" data-mem="'+esc(m.user_id)+'"><span class="mav">'+esc(short(m.email).charAt(0).toUpperCase())+'</span><span class="mem">'+esc(m.email||m.user_id)+'</span><span class="chev">›</span></button>'}).join(''):'<div class="mnone">No one yet</div>')+'</div>';
  });
  document.getElementById('mbody').innerHTML=h;
}
function openMember(id){
  var m=MEM.find(function(x){return x.user_id===id});if(!m)return;
  openSheet('<h3 style="overflow-wrap:anywhere">'+esc(m.email||m.user_id)+'</h3><div class="pinfo">Tap a role to switch them.</div>'+ROLES.map(function(r){var on=m.role===r[0];return '<button class="rpick'+(on?' on':'')+'" data-rp="'+r[0]+'"><b>'+(on?'✓ ':'')+r[2]+'</b><small>'+r[3]+'</small></button>'}).join('')+'<div class="perr" id="rperr"></div><button class="btn dangerbtn" id="rm">Remove from app</button><button class="btn alt" id="x">Close</button>');
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('sheet').querySelectorAll('[data-rp]').forEach(function(b){b.onclick=async function(){
    var nr=b.dataset.rp;if(nr===m.role){closeSheet();return}
    var r=await sb.from('members').update({role:nr}).eq('user_id',id).select();
    if(r.error||!r.data||!r.data.length){document.getElementById('rperr').innerHTML=setupHint(r.error?r.error.message:'Not changed. Try again.');return}
    closeSheet();toast(short(m.email)+' is now a '+roleName(nr)+'.',true);await loadMem();drawMembers();if(otApi)otApi.reload();
  }});
  document.getElementById('rm').onclick=function(){
    openSheet('<h3>Remove '+esc(short(m.email))+'?</h3><p style="color:var(--mute);margin:0 0 14px;overflow-wrap:anywhere">'+esc(m.email||'')+' will be logged out and locked out of the app. Their videos stay. This cannot be undone.</p><button class="btn dangerbtn" id="yes">Yes, remove</button><button class="btn alt" id="x">Cancel</button>');
    document.getElementById('x').onclick=function(){openMember(id)};
    document.getElementById('yes').onclick=async function(){var d=await sb.from('members').delete().eq('user_id',id).select();closeSheet();if(d.error||!d.data||!d.data.length){toast('Not removed: '+(d.error?d.error.message:'try again'));return}toast(short(m.email)+' was removed.',true);await loadMem();drawMembers()};
  };
}
document.getElementById('mpage').addEventListener('click',async function(e){
  var b=e.target.closest('[data-mclose],[data-ar],[data-mem],#maddGo');if(!b)return;var d=b.dataset;
  if(d.mclose){document.getElementById('mpage').classList.remove('on');if(otApi)otApi.reload()}
  else if(d.ar){addRole=d.ar;document.querySelectorAll('#rseg button').forEach(function(x){x.classList.toggle('on',x.dataset.ar===addRole)});document.getElementById('maddGo').textContent='Add as '+roleName(addRole)}
  else if(d.mem){openMember(d.mem)}
  else if(b.id==='maddGo'){
    var em=document.getElementById('maddE').value.trim(),msg=document.getElementById('mmsg');msg.innerHTML='';
    if(!/^\S+@\S+\.\S+$/.test(em)){msg.textContent='Type their email first.';return}
    b.disabled=true;b.textContent='Adding...';
    var r=await sb.rpc('add_member',{p_email:em,p_role:addRole});
    if(r.error&&/no account/i.test(r.error.message||'')){var inv=await invite(em,addRole);b.disabled=false;b.textContent='Add as '+roleName(addRole);
      if(inv.error){msg.innerHTML=inv.error;return}await loadMem();drawMembers();showInvite(inv);return}
    b.disabled=false;b.textContent='Add as '+roleName(addRole);
    if(r.error){msg.innerHTML=setupHint(r.error.message);return}
    toast(short(em)+' already had an account, so they’re back in as a '+roleName(addRole)+'.',true);await loadMem();drawMembers();
  }
});

/* ---------- swipe between the two screens ---------- */
var scr='orders',sw=null,swUntil=0,scrY={orders:0,stats:0,panels:0};
var SCR_NAME={orders:'Orders Tracker',stats:'Stats',panels:'Panels Tracker'};
function screens(){var l=['orders'];if(user&&canVideos())l.push('stats');if(user&&canPanels())l.push('panels');return l}
function scrEl(n){return document.getElementById(n==='orders'?'oscreen':n==='stats'?'sscreen':'pscreen')}
var TAB_NAME={orders:'Orders',stats:'Stats',panels:'Panels'};
function paintDots(from){var l=screens(),k=l.indexOf(scr),key=l.join(',');
  document.querySelectorAll('.stabs').forEach(function(d){
    if(d.dataset.key!==key){d.dataset.key=key;d.style.setProperty('--n',l.length);d.innerHTML='<i></i>'+l.map(function(n){return '<button data-scr="'+n+'" aria-label="'+SCR_NAME[n]+'">'+TAB_NAME[n]+'</button>'}).join('')}
    d.hidden=l.length<2;
    d.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.scr===scr)});
    var f=l.indexOf(from);
    if(f>=0&&f!==k){d.classList.add('still');d.style.setProperty('--k',f);void d.offsetWidth;d.classList.remove('still')}
    d.style.setProperty('--k',Math.max(0,k));
  })}
function setScreen(n,dir){
  var l=screens();if(n===scr||l.indexOf(n)<0)return;
  var from=scrEl(scr),to=scrEl(n);scrY[scr]=window.scrollY;
  from.style.display='none';from.style.transform='';from.style.opacity='';
  var was=scr;scr=n;to.style.display='block';document.body.classList.toggle('ot-on',n!=='panels');if(n==='stats')paintStats(true);if(n==='orders'&&otApi&&otApi.fillIn)otApi.fillIn();
  document.getElementById('menu').classList.remove('on');paintDots(was);paintMenu();window.scrollTo(0,scrY[n]||0);
  if(dir==null)dir=l.indexOf(n)>l.indexOf(was)?1:-1;
  try{to.animate([{transform:'translateX('+(dir*36)+'%)',opacity:.3},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})}catch(e){}
}
function canSwipe(t){
  if(!user||screens().length<2||editing||drag||dragging)return false;
  if(document.getElementById('mpage').classList.contains('on'))return false;
  if(document.getElementById('veil').style.display==='flex'||document.getElementById('cpage').classList.contains('on')||document.getElementById('login').style.display==='flex')return false;
  if(t.closest&&t.closest('#tabs,.ot-seg,.ot-who,input,textarea,select,.ot-pop,#menu'))return false;
  if(scr==='orders'&&document.querySelector('#otroot .ot-egrid'))return false;
  return true;
}
document.addEventListener('touchstart',function(e){
  if(e.touches.length!==1||!canSwipe(e.target)){sw=null;return}
  var t=e.touches[0];sw={x:t.clientX,y:t.clientY,on:false,dead:false,dx:0};
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!sw||sw.dead)return;
  var t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.on){
    if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){sw.dead=true;return}
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){sw.on=true;document.body.classList.add('swiping');clearTimeout(ht);if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
    else return;
  }
  e.preventDefault();sw.dx=dx;
  var el=scrEl(scr);el.style.transform='translateX('+dx+'px)';el.style.opacity=String(1-Math.min(Math.abs(dx)/innerWidth,1)*.6);
},{passive:false});
function swEnd(){
  if(!sw)return;var s=sw;sw=null;if(!s.on)return;
  swUntil=Date.now()+500;setTimeout(function(){document.body.classList.remove('swiping')},30);
  var el=scrEl(scr);
  if(scr==='panels'&&inSite()&&Math.abs(s.dx)>Math.min(80,innerWidth*.2)){var ti=TABS.map(function(t){return t[0]}).indexOf(tab)+(s.dx<0?1:-1);
    if(ti>=0&&ti<TABS.length){var dr=s.dx<0?1:-1;tab=TABS[ti][0];el.style.transform='';el.style.opacity='';render();window.scrollTo(0,0);
      try{document.getElementById('main').animate([{transform:'translateX('+(dr*30)+'%)',opacity:.3},{transform:'none',opacity:1}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'})}catch(e){}
      var ob=document.querySelector('#tabs .on');if(ob&&ob.scrollIntoView)ob.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});return}}
  var l=screens(),next=l[l.indexOf(scr)+(s.dx<0?1:-1)];
  if(next&&Math.abs(s.dx)>Math.min(80,innerWidth*.2)){
    var dir=s.dx<0?1:-1;
    var a=null;try{a=el.animate([{transform:'translateX('+s.dx+'px)',opacity:el.style.opacity},{transform:'translateX('+(-dir*100)+'%)',opacity:0}],{duration:160,easing:'ease-in'})}catch(e){}
    var go=function(){setScreen(next,dir)};if(a)a.onfinish=go;else go();
  }else{
    try{el.animate([{transform:'translateX('+s.dx+'px)',opacity:el.style.opacity},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'})}catch(e){}
    el.style.transform='';el.style.opacity='';
  }
}
document.addEventListener('touchend',swEnd);
document.addEventListener('touchcancel',swEnd);
['gesturestart','gesturechange'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('click',function(e){if(Date.now()<swUntil){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('click',function(e){var b=e.target.closest('[data-scr]');if(b)setScreen(b.dataset.scr)});
paintDots();

boot();
</script>
</body>
