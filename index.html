<style>
:root{--bg:#0a0a12;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--ink:#f2f2f7;--mute:#8e8ea3;--a1:#8b5cf6;--a2:#22d3ee;--ok:#34d399;--bad:#fb7185;--wait:#fbbf24;--part:#f97316;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}

button{font:inherit;color:inherit;cursor:pointer}

.hrow{display:flex;align-items:center;gap:12px;min-height:46px;max-width:640px;margin:0 auto}
#back{display:none;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.3)}

#tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(139,92,246,.4)}
#main{max-width:640px;margin:0 auto;padding:14px 14px 130px}
.sec{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer}

.sec .i{flex:1;min-width:0}.sec .t{font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis}.sec .s{color:var(--mute);font-size:14px}

.mh{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:28px 2px 8px;background:linear-gradient(135deg,#fff,#b9a6ff 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:600;color:var(--ink)}
.cnt{color:var(--a2);font-size:14px;font-weight:600;background:rgba(34,211,238,.12);border-radius:999px;padding:2px 10px}

#fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:34px;line-height:1;box-shadow:0 8px 28px rgba(139,92,246,.55);z-index:8}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:40}
#sheet{background:#14141f;border:1px solid var(--line);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet h3{margin:0 0 14px;font-size:22px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:17px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--a1)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:17px;font-weight:600;margin-top:6px}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.mh{display:flex;align-items:center;gap:10px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.mt{background:linear-gradient(135deg,#fff,#b9a6ff 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.me{font-size:30px}
.ico{font-size:24px}
.ico{width:52px;height:52px;background:none;box-shadow:none;border-radius:0;font-size:44px;line-height:1}
.ico.l{font-size:28px;font-weight:700;color:var(--mute)}
.sec{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ico img{width:100%;height:100%;object-fit:contain;display:block}
.me{width:36px;height:36px;object-fit:contain}
.seg{grid-template-columns:repeat(4,1fr);gap:5px}
.seg button{font-size:12.5px}
.seg .partial.on{background:rgba(249,115,22,.18);color:var(--part);border-color:var(--part)}
#tabs button.t-working.on{background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 4px 16px rgba(52,211,153,.4)}
#tabs button.t-partial.on{background:linear-gradient(135deg,#ea580c,#fb923c);box-shadow:0 4px 16px rgba(249,115,22,.45)}
#tabs button.t-failed.on{background:linear-gradient(135deg,#dc2626,#fb7185);box-shadow:0 4px 16px rgba(251,113,133,.4)}
#pen{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#pen.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 4px 16px rgba(139,92,246,.5)}
.dangerbtn{background:linear-gradient(135deg,#dc2626,#fb7185)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.lbox{width:100%;max-width:380px}
.lt{font-size:34px;font-weight:800;margin:0 0 6px;background:linear-gradient(135deg,#fff,#b9a6ff 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lp{color:var(--mute);margin:0 0 18px}
#lmsg{color:var(--bad);margin-top:12px;font-size:15px;min-height:20px}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#2a1620;border:1px solid var(--bad);color:var(--ink);padding:12px 14px;border-radius:14px;z-index:70;font-size:15px}
.hrow{position:relative}
#more{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#menu{display:none;position:absolute;top:52px;right:0;min-width:170px;background:#1b1b29;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20}
#menu.on{display:block}
#menu button{width:100%;text-align:left;border:none;background:none;color:var(--bad);font-size:16px;font-weight:600;padding:12px;border-radius:10px}
#menu button:active{background:var(--card2)}
#menu .mi{color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--bad);background:rgba(251,113,133,.12);color:var(--bad);font-size:18px;line-height:1}
.fl{display:block;text-align:center;color:var(--a2);margin-top:14px;font-size:15px;background:none;border:none;width:100%}
.ok{color:var(--ok)!important}
#cpage{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#cpage.on{display:block}
.chead{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(10,10,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:2}
.chead .cb{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px;display:flex;align-items:center;justify-content:center}
.chead h2{margin:0;font-size:24px;font-weight:700;flex:1}
#clist{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.ccard{padding:14px;margin-bottom:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.ccard .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:19px;margin-bottom:8px}
.cf{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.cf .cl{flex:none;width:72px;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.cf .cv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.cf button{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div id="top">
  <div class="hrow"><button id="back" data-back="1" aria-label="Back">&#8592;</button><div><h1 id="ttl">Order Tracker</h1><div id="crumb"></div></div><button id="pen" data-pen="1" aria-label="Edit mode">&#9998;</button><button id="more" data-more="1" aria-label="More">&#8943;</button><div id="menu"><button class="mi" data-creds="1">Login credentials</button><button class="mi" id="modsBtn" data-mods="1" style="display:none">Mods</button><button data-logout="1">Log out</button></div></div>
  <div id="tabs"></div>
</div>
<div id="main"><div class="empty">Loading...</div></div>
<button id="fab" aria-label="Add">+</button>
<div id="cpage"><div class="chead"><button class="cb" data-cclose="1" aria-label="Back">&#8592;</button><h2>Logins</h2><button class="btn" id="cadd" data-cadd="1" style="display:none;width:auto;margin:0;padding:10px 14px;font-size:15px">+ Add</button></div><div id="clist"></div></div>
<div id="veil"><div id="sheet"></div></div>
<div id="login"><div class="lbox"><h2 class="lt">Order Tracker</h2><p class="lp">Sign in to continue</p><input type="email" id="lem" placeholder="Email" autocomplete="username"><input type="password" id="lpw" placeholder="Password" autocomplete="current-password"><button class="btn" id="lgo">Sign in</button><button class="fl" id="lfg">Forgot password?</button><div id="lmsg"></div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="icons.js"></script>
<script>
var KEY='order-tracker-v1',S={nodes:[],orders:[]},tab='main',path=[],openG={},sb=null,user=null,isAdmin=false,snap={n:{},o:{}},q=Promise.resolve();
var SB_URL='https://ttnvbmqtyxbqfyxadjdf.supabase.co',SB_KEY='sb_publishable_1gfteu6dl--6yOo8FKMFow_QmAO7FGE';
function localOld(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.nodes&&r.nodes.length)return r}catch(e){}return null}
function seedDefaults(){
  var IMGS=window.IMGS||{};
  var ic=function(p){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>')};
  [['Views','<path d="M6 4l14 8-14 8z"/>'],
   ['Likes','<path d="M12 20s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 5.8-8 11-8 11z"/>'],
   ['Shares','<path d="M21 3L3 10l7 3 3 7z"/><path d="M10 13L21 3"/>'],
   ['Saves','<path d="M6 3h12v18l-6-4-6 4z"/>'],
   ['Reposts','<path d="M4 11V9a3 3 0 0 1 3-3h11"/><path d="M15 3l3 3-3 3"/><path d="M20 13v2a3 3 0 0 1-3 3H6"/><path d="M9 21l-3-3 3-3"/>'],
   ['Comments','<path d="M4 20l1.5-4A8 8 0 1 1 8.5 19z"/>']
  ].forEach(function(r){S.nodes.push({id:uid(),title:r[0],parent:null,img:IMGS[r[0]]||ic(r[1])})});
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},4500)}
function depth(n){var d=0;while(n&&n.parent){n=node(n.parent);d++}return d}
function mkSnap(){var n={},o={};S.nodes.forEach(function(x){n[x.id]=JSON.stringify([x.title,x.parent||null,x.img||null])});S.orders.forEach(function(x){o[x.id]=JSON.stringify([x.node,x.title,String(x.price),x.status,!!x.star])});return{n:n,o:o}}
function save(){q=q.then(push).catch(function(e){toast('Not saved: '+((e&&e.message)||e));return load().then(render)})}
async function push(){
  if(!sb||!user)return;
  var c2=mkSnap(),r,upN=[],upO=[],delN=[],delO=[];
  S.nodes.forEach(function(n){if(snap.n[n.id]!==c2.n[n.id])upN.push(n)});
  S.orders.forEach(function(o){if(snap.o[o.id]!==c2.o[o.id])upO.push(o)});
  Object.keys(snap.n).forEach(function(id){if(!c2.n[id])delN.push(id)});
  Object.keys(snap.o).forEach(function(id){if(!c2.o[id])delO.push(id)});
  if(delO.length){r=await sb.from('orders').delete().in('id',delO);if(r.error)throw r.error}
  if(delN.length){r=await sb.from('nodes').delete().in('id',delN);if(r.error)throw r.error}
  if(upN.length){upN.sort(function(a,b){return depth(a)-depth(b)});r=await sb.from('nodes').upsert(upN.map(function(n){return{id:n.id,title:n.title,parent:n.parent||null,img:n.img||null}}));if(r.error)throw r.error}
  if(upO.length){r=await sb.from('orders').upsert(upO.map(function(o){return{id:o.id,node:o.node,title:o.title,price:String(o.price),status:o.status,star:!!o.star}}));if(r.error)throw r.error}
  snap=c2;
}
async function load(){
  var a=await sb.from('nodes').select('*').order('created_at',{ascending:true});
  var b=await sb.from('orders').select('*').order('created_at',{ascending:true});
  if(a.error)throw a.error;if(b.error)throw b.error;
  S.nodes=a.data.map(function(r){return{id:r.id,title:r.title,parent:r.parent||null,img:r.img||null}});
  S.orders=b.data.map(function(r){return{id:r.id,node:r.node,title:r.title,price:r.price,status:r.status,star:!!r.star}});
  path=path.filter(function(id){return node(id)});
  snap=mkSnap();
}
async function stillMember(){if(!user)return false;var r=await sb.from('members').select('user_id').eq('user_id',user.id);return !!(r.error||(r.data&&r.data.length))}
function kick(msg){document.getElementById('cpage').classList.remove('on');var u=user;user=null;isAdmin=false;S={nodes:[],orders:[]};path=[];editing=false;closeSheet();document.getElementById('main').innerHTML='';sb.auth.signOut().catch(function(){});document.getElementById('login').style.display='flex';document.getElementById('lmsg').textContent=msg||''}
function refresh(){if(!user||document.hidden||document.getElementById('veil').style.display==='flex')return;q=q.then(async function(){if(!isAdmin&&!(await stillMember())){kick('Your access to this app has been removed.');return}await load();render()}).catch(function(){})}
async function start(u){
  user=u;document.getElementById('login').style.display='none';
  var a=await sb.from('admins').select('user_id').eq('user_id',u.id);
  isAdmin=!!(a.data&&a.data.length);
  document.getElementById('modsBtn').style.display=isAdmin?'block':'none';
  if(!isAdmin&&!(await stillMember()))return kick('Your access to this app has been removed.');
  await load();
  if(!S.nodes.length&&isAdmin){
    var old=localOld();
    if(old){S.nodes=old.nodes.map(function(n){return{id:n.id,title:n.title,parent:n.parent||null,img:n.img||null}});S.orders=(old.orders||[]).map(function(o){return{id:o.id,node:o.node,title:o.title,price:o.price,status:o.status||'processing',star:!!o.star}})}
    else seedDefaults();
    save();await q;
  }
  render();
}
async function boot(){
  try{
    sb=supabase.createClient(SB_URL,SB_KEY);
    sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')setTimeout(newPassword,300)});
    var r=await sb.auth.getSession();
    if(r.data&&r.data.session)await start(r.data.session.user);else document.getElementById('login').style.display='flex';
  }catch(e){document.getElementById('main').innerHTML='<div class="empty"><b>⚠️</b>Could not connect.<br>Check your internet and reopen the app.</div>';toast(String((e&&e.message)||e))}
}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function node(id){return S.nodes.find(function(n){return n.id===id})}
function kids(p){return S.nodes.filter(function(n){return n.parent===p})}
function cur(){return path.length?path[path.length-1]:null}
function chain(id){var c=[],n=node(id);while(n){c.unshift(n);n=n.parent?node(n.parent):null}return c}
var editing=false;
var TABS=[['main','Main'],['working','Working'],['partial','Partial'],['failed','Failed'],['favorites','Favorites']];
var STS=[['processing','Processing','var(--wait)'],['working','Working','var(--ok)'],['partial','Partial','var(--part)'],['failed','Failed','var(--bad)']];
function ordHtml(o){
  return '<div class="ord"><div class="top"><div><div class="t">'+esc(o.title)+'</div><div class="price">'+esc(o.price)+' per 1,000</div></div>'
  +'<div><button class="ghost star'+(o.star?' on':'')+'" data-star="'+o.id+'">'+(o.star?'★':'☆')+'</button>'+(editing?'<button class="ghost" data-delord="'+o.id+'">\u{1F5D1}</button>':'')+'</div></div>'
  +'<div class="seg">'+STS.map(function(s){return '<button class="'+s[0]+(o.status===s[0]?' on':'')+'" data-st="'+s[0]+'" data-o="'+o.id+'">'+s[1]+'</button>'}).join('')+'</div></div>';
}
function render(){
  var c=cur();
  document.getElementById('back').style.display=(tab==='main'&&c)?'flex':'none';
  document.getElementById('ttl').textContent=tab==='main'?(c?node(c).title:'Order Tracker'):TABS.filter(function(t){return t[0]===tab})[0][1];
  document.getElementById('crumb').textContent=(tab==='main'&&c)?chain(c).map(function(n){return n.title}).join('  ›  '):'';
  document.getElementById('fab').style.display=(tab==='main'&&(c||isAdmin))?'block':'none';
  document.getElementById('pen').classList.toggle('on',editing);
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="t-'+t[0]+(tab===t[0]?' on':'')+'">'+t[1]+'</button>'}).join('');
  var h='';
  if(tab==='main'){
    var ks=kids(c),os=S.orders.filter(function(o){return o.node===c});
    if(!ks.length&&!os.length)h+='<div class="empty"><b>✨</b>'+(c?'Nothing here yet.<br>Tap + to add a section or an order.':'Clean slate.<br>Tap + to create your first title.')+'</div>';
    if(ks.length){if(c)h+='<div class="sg">Sections</div>';ks.forEach(function(k){var n=kids(k.id).length,m=S.orders.filter(function(o){return o.node===k.id}).length;
      h+='<div class="sec" data-open="'+k.id+'"><div class="ico'+(k.img?'':' l')+'"'+(k.parent===null&&isAdmin?' data-icon="'+k.id+'"':'')+'>'+(k.img?'<img src="'+k.img+'" alt="">':esc(k.title.charAt(0).toUpperCase()))+'</div><div class="i"><div class="t">'+esc(k.title)+'</div><div class="s">'+n+' sections · '+m+' orders</div></div>'+(editing&&(isAdmin||k.parent!==null)?'<button class="ghost" data-delnode="'+k.id+'">\u{1F5D1}</button>':'')+'<span class="chev">›</span></div>'})}
    STS.forEach(function(s){var g=os.filter(function(o){return o.status===s[0]});if(g.length)h+='<div class="sg"><span class="dot" style="background:'+s[2]+'"></span>'+s[1]+'</div>'+g.map(ordHtml).join('')});
  }else{
    var list=S.orders.filter(function(o){return tab==='favorites'?o.star:o.status===tab});
    if(!list.length)h+='<div class="empty"><b>\u{1F4ED}</b>No orders here yet.</div>';
    var groups={};
    list.forEach(function(o){var ch=chain(o.node);if(!ch.length)return;var m=ch[0].id,s=ch[1]?ch[1].id:'_';groups[m]=groups[m]||{};(groups[m][s]=groups[m][s]||[]).push(o)});
    Object.keys(groups).forEach(function(m){
      var mn=node(m);h+='<div class="mh">'+(mn.img?'<img class="me" src="'+mn.img+'" alt="">':'')+'<span class="mt">'+esc(mn.title)+'</span></div>';
      Object.keys(groups[m]).forEach(function(s){
        var key=tab+'|'+m+'|'+s,op=openG[key],g=groups[m][s];
        h+='<button class="sh" data-tog="'+key+'"><span>'+(op?'▾ ':'▸ ')+(s==='_'?'General':esc(node(s).title))+'</span><span class="cnt">'+g.length+'</span></button>'+(op?g.map(ordHtml).join(''):'');
      });
    });
  }
  document.getElementById('main').innerHTML=h;
}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('veil').style.display='flex'}
function closeSheet(){document.getElementById('veil').style.display='none'}
function newSection(){
  openSheet('<h3>New '+(cur()?'section':'title')+'</h3><input type="text" id="f1" placeholder="Title"><button class="btn" id="ok">Create</button><button class="btn alt" id="x">Cancel</button>');
  document.getElementById('ok').onclick=function(){var v=document.getElementById('f1').value.trim();if(!v)return;S.nodes.push({id:uid(),title:v,parent:cur()});save();closeSheet();render()};
  document.getElementById('x').onclick=closeSheet;
}
function newOrder(){
  openSheet('<h3>New order</h3><input type="text" id="f1" placeholder="Order title"><input type="number" id="f2" inputmode="decimal" placeholder="Price per thousand"><button class="btn" id="ok">Create order</button><button class="btn alt" id="x">Cancel</button>');
  document.getElementById('ok').onclick=function(){var t=document.getElementById('f1').value.trim(),p=document.getElementById('f2').value.trim();if(!t||!p)return;
    S.orders.push({id:uid(),node:cur(),title:t,price:p,status:'processing',star:false});save();closeSheet();render()};
  document.getElementById('x').onclick=closeSheet;
}
function openIcon(id){
  var n=node(id);
  openSheet('<h3>Section icon</h3><p style="color:var(--mute);margin:0 0 12px;font-size:15px">Transparent PNG, 256 x 256 pixels, square.</p><input type="file" accept="image/png" id="fi" style="display:none"><button class="btn" id="up">Choose PNG</button>'+(n.img?'<button class="btn alt" id="rm">Remove icon</button>':'')+'<button class="btn alt" id="x">Cancel</button>');
  var fi=document.getElementById('fi');
  document.getElementById('up').onclick=function(){fi.click()};
  fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=256;var s=Math.min(256/im.width,256/im.height),w=im.width*s,h=im.height*s;c.getContext('2d').drawImage(im,(256-w)/2,(256-h)/2,w,h);n.img=c.toDataURL('image/png');save();closeSheet();render()};im.src=r.result};r.readAsDataURL(f)};
  var rm=document.getElementById('rm');if(rm)rm.onclick=function(){delete n.img;save();closeSheet();render()};
  document.getElementById('x').onclick=closeSheet;
}
function askDel(what,fn){
  openSheet('<h3>Are you sure?</h3><p style="color:var(--mute);margin:0 0 14px">Are you sure you want to delete this '+what+'? This cannot be undone.</p><button class="btn dangerbtn" id="yes">Yes, delete</button><button class="btn alt" id="x">Cancel</button>');
  document.getElementById('yes').onclick=function(){fn();closeSheet();render()};
  document.getElementById('x').onclick=closeSheet;
}
function delNode(id){
  var rm=[id];for(var i=0;i<rm.length;i++)kids(rm[i]).forEach(function(k){rm.push(k.id)});
  S.nodes=S.nodes.filter(function(n){return rm.indexOf(n.id)<0});S.orders=S.orders.filter(function(o){return rm.indexOf(o.node)<0});path=path.filter(function(x){return rm.indexOf(x)<0});save();
}
function askLogout(){
  openSheet('<h3>Log out?</h3><p style="color:var(--mute);margin:0 0 14px">Are you sure you want to log out?</p><button class="btn dangerbtn" id="yes">Yes</button><button class="btn alt" id="x">No</button>');
  document.getElementById('yes').onclick=function(){closeSheet();sb.auth.signOut().then(function(){location.reload()})};
  document.getElementById('x').onclick=closeSheet;
}
async function openMods(){
  openSheet('<h3>Mods</h3><div id="mlist" style="color:var(--mute);margin-bottom:12px">Loading...</div><input type="email" id="madd" placeholder="Add mod by email"><button class="btn" id="mgo">Add mod</button><div id="mmsg" style="color:var(--bad);margin-top:10px;font-size:15px"></div><button class="btn alt" id="x">Close</button>');
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('mgo').onclick=async function(){var e=document.getElementById('madd').value.trim(),m=document.getElementById('mmsg');m.className='';m.textContent='';if(!e)return;var r=await sb.rpc('add_member',{p_email:e});if(r.error){m.textContent=r.error.message;return}openMods()};
  var r=await sb.from('members').select('user_id,email').order('added_at',{ascending:true});
  var el=document.getElementById('mlist');if(!el)return;
  if(r.error){el.textContent='Could not load mods: '+r.error.message;return}
  if(!r.data.length){el.textContent='No mods yet.';return}
  el.innerHTML=r.data.map(function(x){return '<div class="mrow"><span>'+esc(x.email||x.user_id)+'</span><button data-rm="'+x.user_id+'" data-em="'+esc(x.email||'')+'" aria-label="Revoke">✕</button></div>'}).join('');
  el.onclick=function(ev){var b=ev.target.closest('[data-rm]');if(!b)return;var id=b.dataset.rm,em=b.dataset.em;
    openSheet('<h3>Revoke access?</h3><p style="color:var(--mute);margin:0 0 14px">'+esc(em)+' will be logged out and locked out of the app.</p><button class="btn dangerbtn" id="yes">Yes, revoke</button><button class="btn alt" id="x">No</button>');
    document.getElementById('x').onclick=openMods;
    document.getElementById('yes').onclick=async function(){var d=await sb.from('members').delete().eq('user_id',id);if(d.error)toast('Not revoked: '+d.error.message);openMods()}};
}
async function forgotPw(){
  var em=document.getElementById('lem').value.trim(),m=document.getElementById('lmsg');m.className='';
  if(!em){m.textContent='Type your email above first, then tap Forgot password.';return}
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(r.error){m.textContent=r.error.message;return}
  m.className='ok';m.textContent='Check your email for a reset link.';
}
function newPassword(){
  openSheet('<h3>Set a new password</h3><input type="password" id="np1" placeholder="New password" autocomplete="new-password"><input type="password" id="np2" placeholder="Repeat new password" autocomplete="new-password"><button class="btn" id="ok">Save password</button><div id="npm" style="color:var(--bad);margin-top:10px;font-size:15px"></div>');
  document.getElementById('ok').onclick=async function(){var a=document.getElementById('np1').value,b=document.getElementById('np2').value,m=document.getElementById('npm');
    if(a.length<6){m.textContent='Use at least 6 characters.';return}if(a!==b){m.textContent='The passwords do not match.';return}
    var r=await sb.auth.updateUser({password:a});if(r.error){m.textContent=r.error.message;return}
    closeSheet();toast('Password updated.');history.replaceState(null,'',location.pathname)};
}
var CR=[],shown={};
async function openCreds(){
  document.getElementById('cpage').classList.add('on');
  document.getElementById('cadd').style.display=isAdmin?'block':'none';
  document.getElementById('clist').innerHTML='<div class="empty" style="margin-top:60px">Loading...</div>';
  var r=await sb.from('creds').select('*').order('created_at',{ascending:true});
  if(r.error){document.getElementById('clist').innerHTML='<div class="empty" style="margin-top:60px">Could not load logins.<br>'+esc(r.error.message)+'</div>';return}
  CR=r.data;drawCreds();
}
function drawCreds(){
  var el=document.getElementById('clist');
  if(!CR.length){el.innerHTML='<div class="empty" style="margin-top:60px"><b>\u{1F510}</b>No logins yet.'+(isAdmin?'<br>Tap + Add to save one.':'')+'</div>';return}
  el.innerHTML=CR.map(function(c){var sh=shown[c.id];
    return '<div class="ccard"><div class="ct"><span>'+esc(c.site)+'</span>'+(isAdmin?'<button class="ghost" data-cdel="'+c.id+'" aria-label="Delete">\u{1F5D1}</button>':'')+'</div>'
    +'<div class="cf"><span class="cl">Email</span><span class="cv">'+esc(c.email)+'</span><button data-ccopy="'+c.id+'" data-f="email">Copy</button></div>'
    +'<div class="cf"><span class="cl">Password</span><span class="cv">'+(sh?esc(c.password):'••••••••')+'</span><button data-cshow="'+c.id+'">'+(sh?'Hide':'Show')+'</button><button data-ccopy="'+c.id+'" data-f="password">Copy</button></div></div>'}).join('');
}
function addCred(){
  openSheet('<h3>New login</h3><input type="text" id="cs" placeholder="Website name" autocomplete="off"><input type="text" id="ce" placeholder="Email or username" autocomplete="off" autocapitalize="off"><input type="text" id="cp" placeholder="Password" autocomplete="off" autocapitalize="off"><button class="btn" id="ok">Add login info</button><div id="cm" style="color:var(--bad);margin-top:10px;font-size:15px"></div><button class="btn alt" id="x">Cancel</button>');
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('ok').onclick=async function(){var a=document.getElementById('cs').value.trim(),b=document.getElementById('ce').value.trim(),c=document.getElementById('cp').value,m=document.getElementById('cm');
    if(!a||!b||!c){m.textContent='Fill in all three boxes.';return}
    var r=await sb.from('creds').insert({site:a,email:b,password:c}).select();if(r.error){m.textContent=r.error.message;return}
    closeSheet();CR=CR.concat(r.data);drawCreds()};
}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Copied')},function(){toast('Could not copy')})}
document.getElementById('cpage').addEventListener('click',function(e){
  var b=e.target.closest('[data-cclose],[data-cadd],[data-ccopy],[data-cshow],[data-cdel]');if(!b)return;var d=b.dataset;
  if(d.cclose){document.getElementById('cpage').classList.remove('on');shown={}}
  else if(d.cadd){addCred()}
  else if(d.cshow){shown[d.cshow]=!shown[d.cshow];drawCreds()}
  else if(d.ccopy){var c=CR.find(function(x){return String(x.id)===d.ccopy});if(c)copyText(c[d.f])}
  else if(d.cdel){var c2=CR.find(function(x){return String(x.id)===d.cdel});
    openSheet('<h3>Delete login?</h3><p style="color:var(--mute);margin:0 0 14px">Are you sure you want to delete the '+esc(c2?c2.site:'')+' login? This cannot be undone.</p><button class="btn dangerbtn" id="yes">Yes, delete</button><button class="btn alt" id="x">Cancel</button>');
    document.getElementById('x').onclick=closeSheet;
    document.getElementById('yes').onclick=async function(){var r=await sb.from('creds').delete().eq('id',d.cdel);closeSheet();if(r.error){toast('Not deleted: '+r.error.message);return}CR=CR.filter(function(x){return String(x.id)!==d.cdel});drawCreds()}}
});
var held=false,ht=null,sx=0,sy=0;
function openRename(id){
  var n=node(id);
  openSheet('<h3>Rename</h3><input type="text" id="f1"><button class="btn" id="ok">Save</button><button class="btn alt" id="x">Cancel</button>');
  var f=document.getElementById('f1');f.value=n.title;
  document.getElementById('ok').onclick=function(){var v=f.value.trim();if(!v)return;n.title=v;save();closeSheet();render()};
  document.getElementById('x').onclick=closeSheet;
}
var mainEl=document.getElementById('main');
mainEl.addEventListener('pointerdown',function(e){
  held=false;clearTimeout(ht);
  var s=e.target.closest('.sec');if(!s||e.target.closest('button')||(!isAdmin&&!cur()))return;
  var id=s.dataset.open;sx=e.clientX;sy=e.clientY;
  ht=setTimeout(function(){held=true;openRename(id)},550);
});
mainEl.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)clearTimeout(ht)});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){mainEl.addEventListener(ev,function(){clearTimeout(ht)})});
mainEl.addEventListener('contextmenu',function(e){if(e.target.closest('.sec'))e.preventDefault()});
document.getElementById('fab').onclick=function(){
  if(!cur()){newSection();return}
  openSheet('<h3>Add</h3><button class="btn" id="a1">New section</button><button class="btn" id="a2">New order</button><button class="btn alt" id="x">Cancel</button>');
  document.getElementById('a1').onclick=newSection;document.getElementById('a2').onclick=newOrder;document.getElementById('x').onclick=closeSheet;
};
document.getElementById('veil').onclick=function(e){if(e.target.id==='veil')closeSheet()};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-back],[data-t],[data-open],[data-delnode],[data-delord],[data-star],[data-st],[data-tog],[data-icon],[data-pen],[data-out],[data-more],[data-logout],[data-mods],[data-creds]');
  var mn=document.getElementById('menu');if(!t||!t.dataset.more)mn.classList.remove('on');if(!t)return;
  var d=t.dataset;
  if(held){held=false;return}
  if(d.icon){openIcon(d.icon);return}
  else if(d.pen){editing=!editing}
  else if(d.more){mn.classList.toggle('on');return}
  else if(d.logout){askLogout();return}
  else if(d.mods){openMods();return}
  else if(d.creds){openCreds();return}
  else if(d.out){sb.auth.signOut().then(function(){location.reload()});return}
  else if(d.back){path.pop()}
  else if(d.tog){openG[d.tog]=!openG[d.tog]}
  else if(d.t){tab=d.t}
  else if(d.delnode){askDel('section and everything inside it',function(){delNode(d.delnode)});return}
  else if(d.open){path.push(d.open)}
  else if(d.delord){askDel('order',function(){S.orders=S.orders.filter(function(o){return o.id!==d.delord});save()});return}
  else if(d.star){var o=S.orders.find(function(o){return o.id===d.star});o.star=!o.star;save()}
  else if(d.st){var o2=S.orders.find(function(o){return o.id===d.o});o2.status=d.st;save()}
  render();
});
document.getElementById('lgo').onclick=async function(){
  var m=document.getElementById('lmsg');m.className='';m.textContent='';
  try{var r=await sb.auth.signInWithPassword({email:document.getElementById('lem').value.trim(),password:document.getElementById('lpw').value});
  if(r.error){m.textContent=r.error.message;return}
  await start(r.data.user)}catch(e){m.textContent=String((e&&e.message)||e)}
};
document.getElementById('lfg').onclick=forgotPw;
document.addEventListener('visibilitychange',refresh);
setInterval(refresh,20000);
boot();
</script>
</body>
